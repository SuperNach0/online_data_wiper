name: Exécutable Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m pytest -q
      - name: Fabriquer OnlineDataWiper.exe
        run: pyinstaller --noconfirm OnlineDataWiper.spec
      - name: Vérifier que l'exe s'installe et démarre
        shell: pwsh
        run: |
          $env:BROWSER = "none"
          $env:WIPER_SANS_FENETRE = "1"
          $env:WIPER_DATA_DIR = "$env:RUNNER_TEMP\wiper-test"
          Start-Process -FilePath dist\OnlineDataWiper.exe -ArgumentList "--arriere-plan"
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5000/
              $ok = ($r.StatusCode -eq 200 -and $r.Content -match "Bienvenue")
            } catch {}
          }
          $installe = Test-Path "$env:LOCALAPPDATA\Programs\OnlineDataWiper\OnlineDataWiper.exe"
          $menu = Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Online Data Wiper.lnk"
          Get-Process -Name OnlineDataWiper -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "L'appli installée ne répond pas" }
          if (-not $installe) { throw "L'exe n'a pas été installé" }
          if (-not $menu) { throw "Raccourci du menu Démarrer manquant" }
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineDataWiper-windows
          path: dist/OnlineDataWiper.exe
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OnlineDataWiper.exe
          body: |
            Télécharge **OnlineDataWiper.exe** ci-dessous, puis double-clique dessus.
            Windows peut afficher « Windows a protégé votre ordinateur » : clique sur « Informations complémentaires » puis « Exécuter quand même ».
