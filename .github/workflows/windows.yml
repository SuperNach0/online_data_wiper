name: Exécutable Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m pytest -q
      - name: Fabriquer OnlineDataWiper.exe
        run: pyinstaller --noconfirm OnlineDataWiper.spec
      - name: Vérifier que l'exe démarre
        shell: pwsh
        run: |
          $env:BROWSER = "none"
          $env:WIPER_DATA_DIR = "$env:RUNNER_TEMP\wiper-test"
          $p = Start-Process -FilePath dist\OnlineDataWiper.exe -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5000/
          Stop-Process -Id $p.Id
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch "Acxiom") { throw "L'exe ne répond pas correctement" }
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineDataWiper-windows
          path: dist/OnlineDataWiper.exe
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OnlineDataWiper.exe
          body: |
            Télécharge **OnlineDataWiper.exe** ci-dessous, puis double-clique dessus.
            Windows peut afficher « Windows a protégé votre ordinateur » : clique sur « Informations complémentaires » puis « Exécuter quand même ».
